version: '3.8'

services:
  aqua-neon:
    build: .
    container_name: aqua_neon_platform
    ports:
      - "8000:8000"  # FastAPI Microservice API
      - "8501:8501"  # Streamlit Command Center UI
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=8501
      - API_PORT=8000
