services:
  - type: web
    name: aqua-neon
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
